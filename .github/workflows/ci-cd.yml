# ════════════════════════════════════════════════════════════════════════════════
#  SupportHub — Complete Multi-Platform CI/CD Pipeline
#  Author : Aditya Sahu (Aditya Tech. & Devoops)
#  Stack  : Node.js · Express · MongoDB Atlas · Firebase · EJS
#  Targets: Vercel · Netlify · Render · Self-Hosted VPS
#
#  Pipeline stages
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  1. validate  — syntax check, configs, security audit, dep review       │
#  │  2. test      — smoke tests & module loading checks                     │
#  │  3. deploy    — multi-cloud triggers (Render/Netlify/Vercel/VPS)        │
#  │  4. health    — HTTP health-check on live deployment (/api/ping)        │
#  │  5. version   — bump patch, write versionHistory.json, push [skip ci]   │
#  │  6. notify    — POST broadcast-update → in-app Messages for all users   │
#  │  7. summary   — markdown report to GitHub Step Summary                  │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  Optional GitHub Repository Secrets (Settings → Secrets and variables → Actions):
#  ┌──────────────────────────────┬──────────────────────────────────────────┐
#  │ Secret Name                  │ Description                              │
#  ├──────────────────────────────┼──────────────────────────────────────────┤
#  │ APP_URL                      │ Live URL (e.g. https://supporthub.app)   │
#  │ APP_LOB                      │ Default LOB (e.g. zomato)                │
#  │ DEPLOY_SECRET                │ Shared secret for broadcast-update       │
#  │ RENDER_DEPLOY_HOOK_URL       │ (Optional) Render Deploy Hook Webhook    │
#  │ NETLIFY_DEPLOY_HOOK_URL      │ (Optional) Netlify Build Hook Webhook    │
#  │ VERCEL_DEPLOY_HOOK_URL       │ (Optional) Vercel Deploy Hook Webhook    │
#  │ SSH_HOST                     │ (Optional) VPS IP / Hostname for SSH     │
#  │ SSH_USER                     │ (Optional) SSH username (e.g. ubuntu)    │
#  │ SSH_PRIVATE_KEY              │ (Optional) SSH Private Key (PEM/ED25519) │
#  │ SSH_PORT                     │ (Optional) SSH port (default: 22)        │
#  │ APP_DIR                      │ (Optional) VPS path (/var/www/supporthub)│
#  │ MONGO_URI                    │ (Optional) MongoDB Atlas Connection URI  │
#  │ SESSION_SECRET               │ (Optional) Session encryption secret     │
#  │ GEMINI_API_KEY               │ (Optional) Google Gemini API Key         │
#  │ FIREBASE_SERVICE_ACCOUNT     │ (Optional) Full JSON of Firebase key     │
#  └──────────────────────────────┴──────────────────────────────────────────┘
# ════════════════════════════════════════════════════════════════════════════════

name: "SupportHub CI/CD"

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "public/versionHistory.json"
      - "package.json"
      - "CHANGELOG.md"

  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run validation only (skip deploy)"
        required: false
        default: false
        type: boolean

# ── Cancel superseded runs on the same branch ─────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Global defaults ───────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

# ═══════════════════════════════════════════════════════════════════════════════
#  JOB 1 — VALIDATE & AUDIT
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  validate:
    name: "🔍 Validate & Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: "⬇ Checkout source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙ Setup Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci --prefer-offline

      - name: "📝 Syntax check — Entry points & platform bridges"
        run: |
          echo "Checking application entry points..."
          node --check app.js
          node --check api/index.js
          node --check netlify/functions/server.js
          node --check scripts/updateVersionHistory.js
          echo "Checking routes, controllers, middleware, models..."
          find routes -name "*.js" -exec node --check {} \;
          find controllers -name "*.js" -exec node --check {} \;
          find middleware -name "*.js" -exec node --check {} \;
          find models -name "*.js" -exec node --check {} \;
          find services -name "*.js" -exec node --check {} \;
          echo "✅ All Node.js source files passed syntax checks"

      - name: "🗂 Validate configuration files (JSON & TOML & YAML)"
        run: |
          echo "Validating package.json..."
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ✓')"
          echo "Validating vercel.json..."
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json ✓')"
          if [ -f "public/versionHistory.json" ]; then
            node -e "JSON.parse(require('fs').readFileSync('public/versionHistory.json','utf8')); console.log('versionHistory.json ✓')"
          fi
          test -f "netlify.toml" && echo "netlify.toml ✓"
          test -f "render.yaml" && echo "render.yaml ✓"
          echo "✅ All platform config files validated"

      - name: "🛡 Security audit (npm audit)"
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          HIGH=$(node -e "
            const r = require('./audit-report.json');
            const v = r.metadata?.vulnerabilities || {};
            console.log((v.high||0) + (v.critical||0));
          ")
          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "::warning ::$HIGH high/critical vulnerabilities found. Review via 'npm audit'."
          fi
          echo "✅ Security audit completed"

      - name: "📤 Upload audit report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 7

  # ═════════════════════════════════════════════════════════════════════════════
  #  JOB 2 — SMOKE TEST
  # ═════════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Smoke & Module Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: "⬇ Checkout source"
        uses: actions/checkout@v4

      - name: "⚙ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci --prefer-offline

      - name: "🔬 Module load test"
        env:
          NODE_ENV: test
          PORT: "3999"
          MONGO_URI: "mongodb://localhost:27017/supporthub_test"
          SESSION_SECRET: "ci-test-secret-placeholder-32chars!!"
          GEMINI_API_KEY: "STUB"
          DEPLOY_SECRET: "STUB"
          APP_URL: "http://localhost:3999"
          APP_LOB: "zomato"
        run: |
          node -e "
            const modules = [
              './models/User',
              './models/Message',
              './models/PrivateNote',
              './models/Feedback',
              './models/Sop',
              './middleware/authMiddleware',
              './middleware/errorMiddleware',
              './services/sopAiService',
              './routes/api/messageRoutes',
              './routes/api/candRoutes',
              './routes/api/pnRoutes',
              './routes/api/feedbackRoutes',
              './routes/sopRoutes'
            ];
            let ok = 0, fail = 0;
            for (const m of modules) {
              try { require(m); console.log('  ✓ ' + m); ok++; }
              catch(e) { console.error('  ✗ ' + m + ':', e.message); fail++; }
            }
            console.log(\`\nResult: \${ok} passed, \${fail} failed\`);
            if (fail > 0) process.exit(1);
          "

      - name: "📋 Version script test"
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('scripts/updateVersionHistory.js','utf8');
            new Function(src);
            console.log('✅ updateVersionHistory.js parse OK');
          "

  # ═════════════════════════════════════════════════════════════════════════════
  #  JOB 3 — DEPLOY (Multi-Cloud: Render, Netlify, Vercel, VPS)
  # ═════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Multi-Platform Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, test]

    if: |
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.event.inputs.skip_deploy != true

    steps:
      - name: "⬇ Checkout source"
        uses: actions/checkout@v4

      # ── 3a. Render Webhook Trigger ──────────────────────────────────────────
      - name: "🌐 Trigger Render Deployment"
        if: "${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}"
        run: |
          echo "Triggering Render Deploy Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Render deployment successfully triggered"
          else
            echo "::warning ::Render deploy hook returned status $HTTP_CODE"
          fi

      # ── 3b. Netlify Webhook Trigger ─────────────────────────────────────────
      - name: "🌐 Trigger Netlify Deployment"
        if: "${{ secrets.NETLIFY_DEPLOY_HOOK_URL != '' }}"
        run: |
          echo "Triggering Netlify Build Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}")
          echo "Netlify response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Netlify deployment successfully triggered"
          else
            echo "::warning ::Netlify deploy hook returned status $HTTP_CODE"
          fi

      # ── 3c. Vercel Webhook Trigger ──────────────────────────────────────────
      - name: "🌐 Trigger Vercel Deployment"
        if: "${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}"
        run: |
          echo "Triggering Vercel Deploy Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "Vercel response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Vercel deployment successfully triggered"
          else
            echo "::warning ::Vercel deploy hook returned status $HTTP_CODE"
          fi

      # ── 3d. Self-Hosted VPS SSH Deploy (Optional) ───────────────────────────
      - name: "🔑 Configure SSH Agent (VPS)"
        if: "${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "📡 Deploy to Self-Hosted VPS"
        if: "${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR || '/var/www/supporthub' }}
          NODE_ENV: production
          PORT: ${{ secrets.PORT || '3000' }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_LOB: ${{ secrets.APP_LOB || 'zomato' }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" << 'REMOTE_SCRIPT'
            set -euo pipefail
            cd "${APP_DIR}"
            echo "▶ Pulling latest code..."
            git fetch --all --prune
            git reset --hard origin/main || git reset --hard origin/master

            echo "▶ Updating .env..."
            cat > .env << ENV_BLOCK
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          MONGO_URI=${MONGO_URI}
          SESSION_SECRET=${SESSION_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          APP_URL=${APP_URL}
          APP_LOB=${APP_LOB}
          DEPLOY_SECRET=${DEPLOY_SECRET}
          ENV_BLOCK
            chmod 600 .env

            echo "▶ Installing dependencies..."
            npm ci --omit=dev --prefer-offline

            echo "▶ Reloading under PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
            echo "✅ VPS Deployment completed"
          REMOTE_SCRIPT

      - name: "ℹ️ Deployment Status Notice"
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Deployment Phase Processed"
          echo "  • Vercel / Netlify / Render: If connected to this GitHub repo,"
          echo "    they automatically trigger builds upon push to main."
          echo "  • Deploy Hooks: Executed for any configured provider secrets."
          echo "  • Self-Hosted VPS: Deployed if SSH_HOST secret is configured."
          echo "═══════════════════════════════════════════════════════════════════"

  # ═════════════════════════════════════════════════════════════════════════════
  #  JOB 4 — HEALTH CHECK
  # ═════════════════════════════════════════════════════════════════════════════
  health-check:
    name: "❤️ Live Health Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy

    steps:
      - name: "🩺 Verify /api/ping"
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL repository secret not set — skipping live health check."
            exit 0
          fi

          echo "Pinging ${APP_URL}/api/ping..."
          MAX_RETRIES=10
          RETRY_DELAY=8
          ATTEMPT=0

          until [ $ATTEMPT -ge $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "  Attempt $ATTEMPT/$MAX_RETRIES — $(date '+%H:%M:%S')"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --location "${APP_URL}/api/ping" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App healthy — HTTP 200"
              exit 0
            fi
            echo "  HTTP $HTTP_CODE — retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "::warning ::Live health check timed out after $MAX_RETRIES attempts"

  # ═════════════════════════════════════════════════════════════════════════════
  #  JOB 5 — VERSION & IN-APP BROADCAST
  # ═════════════════════════════════════════════════════════════════════════════
  version-history:
    name: "📋 Version Bump & In-App Broadcast"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: health-check

    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: "⬇ Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚙ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "📈 Bump Version & Record History"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          LOB: ${{ secrets.APP_LOB || 'zomato' }}
        run: node scripts/updateVersionHistory.js

      - name: "📤 Commit and push version bump"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/versionHistory.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            VERSION=$(node -p "require('./package.json').version")
            git commit -m "chore: bump version to v${VERSION} [skip ci]"
            git push
            echo "✅ Pushed version bump v${VERSION}"
          fi

  # ═════════════════════════════════════════════════════════════════════════════
  #  JOB 6 — SUMMARY
  # ═════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate, test, deploy, health-check, version-history]
    if: always()

    steps:
      - name: "📋 Generate GitHub Step Summary"
        env:
          VALIDATE_RES: ${{ needs.validate.result }}
          TEST_RES: ${{ needs.test.result }}
          DEPLOY_RES: ${{ needs.deploy.result }}
          HEALTH_RES: ${{ needs.health-check.result }}
          VERSION_RES: ${{ needs.version-history.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          status_icon() { [ "$1" = "success" ] && echo "✅ Passed" || [ "$1" = "skipped" ] && echo "⏭ Skipped" || echo "❌ Failed"; }

          echo "## 🚀 SupportHub CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${COMMIT_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Stage Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **Validation & Audit** | $(status_icon $VALIDATE_RES) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Smoke & Module Tests** | $(status_icon $TEST_RES) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **Multi-Cloud Deploy** | $(status_icon $DEPLOY_RES) |" >> $GITHUB_STEP_SUMMARY
          echo "| ❤️ **Live Health Check** | $(status_icon $HEALTH_RES) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 **Version Bump & Broadcast** | $(status_icon $VERSION_RES) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$VALIDATE_RES" = "failure" ] || [ "$TEST_RES" = "failure" ] || [ "$DEPLOY_RES" = "failure" ]; then
            echo "❌ Pipeline failed at a critical step."
            exit 1
          fi
          echo "✅ All required pipeline stages completed successfully."
