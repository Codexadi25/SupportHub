[build]
  publish = "public"
  command = "echo 'Building SupportHub'"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,DEV_LOGIN"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "ejs"]
  included_files = ["views/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true