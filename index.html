<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportHub — Connecting to Server</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      color: #60a5fa;
      position: relative;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(96, 165, 250, 0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .icon-wrapper.ready .spinner {
      display: none;
    }

    .icon-wrapper svg {
      display: none;
      width: 32px;
      height: 32px;
      color: var(--success);
    }

    .icon-wrapper.ready svg {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .status-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: monospace;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      flex-shrink: 0;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot.warn { background: var(--warning); }
    .dot.ok { background: var(--success); animation: none; }
    .dot.err { background: var(--danger); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #334155;
      color: var(--text);
    }

    .meta {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon-wrapper" id="iconWrapper">
      <div class="spinner"></div>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 id="heading">Connecting to SupportHub</h1>
    <p id="subtext">Waking up the active server and verifying the login endpoint. You will be redirected automatically.</p>

    <div class="status-pill" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Initializing server check...</span>
    </div>

    <div class="button-group">
      <a class="btn btn-primary" id="directBtn" href="https://supporthub-dkdo.onrender.com/">
        Open SupportHub Directly
      </a>
      <button class="btn btn-secondary" id="retryBtn" type="button" onclick="routeToAvailableServer()">
        Retry Server Check
      </button>
    </div>

    <div class="meta" id="metaText">Auto-failover routing enabled</div>
  </main>

  <script>
    /**
     * Configure your Render instances in priority order.
     * If Server 1 is busy, times out, or returns a 502/503 error,
     * the router automatically moves to the next server in the list.
     */
    const SERVERS = [
      {
        name: "Primary Server",
        checkUrl: "https://supporthub-dkdo.onrenr.com/ogin",
        redirectUrl: "https://supporthub-dkdo.onrender.com/"
      },
      // Add backup Render instances below as needed:
      // {
      //   name: "Backup Server 2",
      //   checkUrl: "https://supporthub-backup.onrender.com/login",
      //   redirectUrl: "https://supporthub-backup.onrender.com/"
      // }
    ];

    // Max wait time (ms) per server before failing over to the next instance
    const TIMEOUT_MS = 18000;

    const headingEl = document.getElementById("heading");
    const subtextEl = document.getElementById("subtext");
    const statusTextEl = document.getElementById("statusText");
    const statusDotEl = document.getElementById("statusDot");
    const iconWrapperEl = document.getElementById("iconWrapper");
    const directBtnEl = document.getElementById("directBtn");
    const metaTextEl = document.getElementById("metaText");

    function updateStatus(text, state = "loading") {
      statusTextEl.textContent = text;
      statusDotEl.className = "dot";
      if (state === "warn") statusDotEl.classList.add("warn");
      if (state === "ok") statusDotEl.classList.add("ok");
      if (state === "err") statusDotEl.classList.add("err");
    }

    async function pingServer(server) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

      try {
        // First attempt: standard CORS request (detects 502/503 busy states accurately)
        const response = await fetch(server.checkUrl, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        // Treat 2xx-4xx as an active Express server; treat 500+ (502/503) as busy/down
        return response.status < 500;
      } catch (err) {
        clearTimeout(timeoutId);

        // If aborted due to timeout, the server is busy or cold-starting too slowly
        if (err.name === "AbortError") {
          return false;
        }

        // Fallback: If CORS isn't enabled on Express yet, verify reachability via no-cors
        const fallbackController = new AbortController();
        const fallbackTimeout = setTimeout(() => fallbackController.abort(), 6000);
        try {
          await fetch(server.checkUrl, {
            method: "GET",
            mode: "no-cors",
            cache: "no-store",
            signal: fallbackController.signal
          });
          clearTimeout(fallbackTimeout);
          return true;
        } catch (_) {
          clearTimeout(fallbackTimeout);
          return false;
        }
      }
    }

    async function routeToAvailableServer() {
      iconWrapperEl.classList.remove("ready");
      headingEl.textContent = "Connecting to SupportHub";

      for (let i = 0; i < SERVERS.length; i++) {
        const server = SERVERS[i];
        directBtnEl.href = server.redirectUrl;
        metaTextEl.textContent = `Checking node ${i + 1} of ${SERVERS.length}`;
        updateStatus(`Pinging ${server.name} (/login)...`, "loading");

        const isAvailable = await pingServer(server);

        if (isAvailable) {
          iconWrapperEl.classList.add("ready");
          headingEl.textContent = "Server Ready";
          subtextEl.textContent = `Connected to ${server.name}. Redirecting now...`;
          updateStatus(`Redirecting to ${server.redirectUrl}`, "ok");

          setTimeout(() => {
            window.location.replace(server.redirectUrl);
          }, 400);
          return;
        }

        if (i < SERVERS.length - 1) {
          updateStatus(`${server.name} busy. Switching to backup...`, "warn");
          await new Promise((r) => setTimeout(r, 800));
        }
      }

      headingEl.textContent = "Servers Currently Waking Up";
      subtextEl.textContent = "All configured Render instances took longer than expected to respond. Click retry or open directly.";
      updateStatus("All nodes timed out or busy", "err");
    }

    // Start routing automatically on page load
    window.addEventListener("DOMContentLoaded", routeToAvailableServer);
  </script>

</body>
</html>
